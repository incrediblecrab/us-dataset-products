# Runs the test suite on pushes to main and pull requests that change local-laws/ or this workflow, so a change that breaks the pipeline fails here rather than in the next scheduled sync. It reads nothing from the Hub and cannot publish: no id-token, read-only contents.
name: local-laws-test

on:
  push:
    branches: [main]
    paths: ['local-laws/**', '.github/workflows/local-laws-test.yml']
  pull_request:
    paths: ['local-laws/**', '.github/workflows/local-laws-test.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: local-laws

concurrency:
  group: local-laws-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: local-laws/pyproject.toml
      - run: pip install -q ".[test]"
      - run: python -m pytest -q
