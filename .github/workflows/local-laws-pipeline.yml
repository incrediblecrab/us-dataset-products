# Probe daily at 12:37 UTC, away from the busy start of the hour. GitHub starts scheduled runs late and sometimes drops them. From November 9 to 22, 2026, it started this repository's daily runs 5.8 to 10.1 hours after 12:37 UTC.
# The probe checks New York filing counts by year, the two FEMA file hashes, and the dataset card render. When the probe says only the card render changed, the workflow commits the card alone; otherwise a needed sync harvests New York and FEMA (when fema.gov refuses the runner, it reuses the FEMA files the last build stored, once they match the manifest), builds all tables from reviewed pins, commits only if the manifest and card changed, and verifies what was published. After any publishable update, the pin check opens one GitHub issue per new LOCUS or BIA release and passes with a warning linking to the open issue. The run fails if the check cannot finish or the issue cannot be looked up or filed.
# Writes to Hugging Face use Trusted Publishing: with `id-token: write`, the CLI sets HF_OIDC_RESOURCE from its --repo before creating a writing HfApi, so no Hugging Face token is stored anywhere. The workflow uses no secret.
name: local-laws-pipeline

on:
  schedule:
    - cron: "37 12 * * *"
  workflow_dispatch:
    inputs:
      args:
        description: "Extra run arguments for a manual test, e.g. --local action-smoke --workdir action-scratch (skips probe, verify and pin check)"
        default: ""

permissions: {}

defaults:
  run:
    working-directory: local-laws

# One run at a time: a scheduled run that starts while another run is still syncing waits for it. GitHub keeps at most one run waiting and cancels older waiting runs.
concurrency:
  group: local-laws-pipeline
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    # The full live path is about 30 minutes of New York pacing, 15 seconds of FEMA pacing, large pinned downloads, upload, verify and margins.
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: local-laws/pyproject.toml
      - run: pip install -q .
      - name: Probe
        id: probe
        if: ${{ !inputs.args }}
        run: |
          set -o pipefail
          python -m local_laws probe | tee probe.json
      - name: Update card only
        id: card
        if: ${{ !inputs.args && steps.probe.outputs.card_only == 'true' }}
        run: python -m local_laws card
      - name: Sync
        id: sync
        if: ${{ (steps.probe.outputs.needed == 'true' && steps.probe.outputs.card_only != 'true') || inputs.args }}
        env:
          EXTRA_ARGS: ${{ inputs.args }}
        run: |
          set -o pipefail
          rm -rf action-scratch
          trap 'rm -rf action-scratch' EXIT
          python -m local_laws run --workdir action-scratch $EXTRA_ARGS | tee run.json
      - name: Verify what was published
        if: ${{ !inputs.args && steps.sync.outputs.commits > 0 }}
        run: |
          set -o pipefail
          python -m local_laws verify | tee verify.json
      - name: Check reviewed source pins
        if: ${{ !inputs.args && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          status=0
          python -m local_laws check-pins > pins.json || status=$?
          cat pins.json
          if [ "$status" -ne 3 ]; then exit "$status"; fi

          jq -ce '.review[]' pins.json | while IFS= read -r item; do
            title=$(jq -er '.title' <<< "$item")
            # An exact title match over the open issues: search syntax would read "local-laws:" as a qualifier.
            url=$(gh issue list --state open --limit 500 --json title,url |
              jq -r --arg title "$title" 'map(select(.title == $title))[0].url // empty')
            if [ -z "$url" ]; then
              source=$(jq -er '.source' <<< "$item")
              case "$source" in
                locus) module=locus ;;
                bia_notices) module=tribes ;;
                *) echo "::error::Unknown pin source: $source"; exit 1 ;;
              esac
              problem=$(jq -er --arg source "$source" '.problems[$source]' pins.json)
              printf -v body '%s\n\nRun: %s\n\nclose this issue after updating the pin in local_laws/%s.py' "$problem" "$RUN_URL" "$module"
              url=$(gh issue create --title "$title" --body "$body")
            fi
            echo "::warning::$title: $url"
          done
      - name: Check FEMA freshness
        if: ${{ !inputs.args && !cancelled() }}
        run: |
          set -o pipefail
          python -m local_laws check-freshness | tee freshness.json
      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          for step in probe run verify pins freshness; do
            if [ -s "$step.json" ]; then { echo "### $step"; echo '```json'; cat "$step.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
          done

  # GitHub disables schedules in a public repository after 60 days without repository activity. This job makes no keepalive commit: GitHub Trust & Safety disabled a keepalive project for circumventing that policy (https://github.com/ddev/github-action-add-on-test/issues/46). Instead it fails once the last commit is 50 days old, so GitHub notifies the user who last changed the cron, who can push a real commit. It runs on every scheduled run, because GitHub can start scheduled runs late or drop them. The log names the schedule that started the run.
  inactivity:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Fail once the repository has gone 50 days without a commit
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "schedule: $SCHEDULE"
          days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "last commit $days days ago"
          if [ "$days" -ge 50 ]; then
            echo "::error::No commit in $days days. GitHub disables this schedule after 60 days without repository activity, so push a commit to keep the dataset updating."
            exit 1
          fi
