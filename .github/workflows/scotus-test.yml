# Runs the test suite on pushes to main and pull requests that change scotus/ or this workflow, so a change that breaks the pipeline fails here rather than in the next scheduled sync. It reads nothing from the Hub and cannot publish: no id-token, read-only contents.
name: scotus-test

on:
  push:
    branches: [main]
    paths: ['scotus/**', '.github/workflows/scotus-test.yml']
  pull_request:
    paths: ['scotus/**', '.github/workflows/scotus-test.yml']

permissions:
  contents: read

defaults:
  run:
    working-directory: scotus

concurrency:
  group: scotus-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install poppler
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q poppler-utils
          pdftotext -v
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: scotus/pyproject.toml
      - run: pip install -q ".[test]"
      - run: python -m pytest -q
